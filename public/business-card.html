<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>홍길동 | 명함</title>
  <style>
    /* ---------- 색상 토큰 (라이트) ---------- */
    :root {
      --bg: #eef1f5;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #5c6773;
      --line: #e3e7ec;
      --accent: #2f6fed;
      --accent-soft: #e6eefe;
      --shadow: 0 10px 30px rgba(20, 30, 50, 0.10), 0 2px 6px rgba(20, 30, 50, 0.06);
    }

    /* ---------- 다크: OS 설정 따름 (토글로 라이트 강제 시 제외) ---------- */
    @media (prefers-color-scheme: dark) {
      :root:not(:has(#theme-light:checked)) {
        --bg: #0f1216;
        --card: #1a1f26;
        --text: #e8ecf1;
        --muted: #9aa5b1;
        --line: #2a313a;
        --accent: #7aa2ff;
        --accent-soft: #232d42;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3);
      }
    }

    /* ---------- 다크: 토글로 강제 ---------- */
    :root:has(#theme-dark:checked) {
      --bg: #0f1216;
      --card: #1a1f26;
      --text: #e8ecf1;
      --muted: #9aa5b1;
      --line: #2a313a;
      --accent: #7aa2ff;
      --accent-soft: #232d42;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      transition: background 0.3s, color 0.3s;
    }

    /* ---------- 테마 토글 (CSS only, radio 3종) ---------- */
    .theme-switch {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: var(--shadow);
    }
    .theme-switch input { position: absolute; opacity: 0; pointer-events: none; }
    .theme-switch label {
      padding: 6px 12px;
      font-size: 13px;
      color: var(--muted);
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
    }
    .theme-switch input:checked + label {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .theme-switch input:focus-visible + label { outline: 2px solid var(--accent); }

    /* ---------- 카드 ---------- */
    .card {
      width: 100%;
      max-width: 360px;
      padding: 40px 32px 32px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      text-align: center;
      transition: background 0.3s, border-color 0.3s;
    }

    /* 프로필 사진: <img>로 교체하거나 이니셜 그대로 사용 */
    .avatar {
      width: 112px;
      height: 112px;
      margin: 0 auto 20px;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), #9b6cff);
      color: #fff;
      font-size: 40px;
      font-weight: 700;
      box-shadow: 0 0 0 4px var(--card), 0 0 0 6px var(--accent-soft);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .name { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
    .role { margin-top: 6px; font-size: 15px; color: var(--muted); }
    .org  {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 12px;
      font-size: 13px;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
    }

    .divider { height: 1px; margin: 28px 0 20px; background: var(--line); }

    /* ---------- 연락처 ---------- */
    .contact { list-style: none; display: grid; gap: 12px; text-align: left; }
    .contact li { display: flex; align-items: center; gap: 12px; font-size: 14px; }
    .contact svg { flex: none; width: 18px; height: 18px; color: var(--accent); }
    .contact a { color: var(--text); text-decoration: none; word-break: break-all; }
    .contact a:hover { color: var(--accent); }

    /* ---------- SNS ---------- */
    .social { display: flex; justify-content: center; gap: 12px; margin-top: 28px; }
    .social a {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 50%;
      transition: color 0.2s, background 0.2s, border-color 0.2s, transform 0.2s;
    }
    .social a:hover,
    .social a:focus-visible {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: transparent;
      transform: translateY(-2px);
    }
    .social svg { width: 20px; height: 20px; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <!-- 테마 토글: 기본값 '자동'은 OS 설정을 따름 -->
  <div class="theme-switch" role="radiogroup" aria-label="테마 선택">
    <input type="radio" name="theme" id="theme-auto" checked>
    <label for="theme-auto">자동</label>
    <input type="radio" name="theme" id="theme-light">
    <label for="theme-light">라이트</label>
    <input type="radio" name="theme" id="theme-dark">
    <label for="theme-dark">다크</label>
  </div>

  <main class="card">
    <!-- 사진 사용 시: <div class="avatar"><img src="profile.jpg" alt="홍길동 프로필 사진"></div> -->
    <div class="avatar" aria-hidden="true">홍</div>

    <h1 class="name">홍길동</h1>
    <p class="role">Strategy Consultant</p>
    <span class="org">ABC Consulting</span>

    <div class="divider"></div>

    <ul class="contact">
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <a href="mailto:hello@example.com">hello@example.com</a>
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
        <a href="tel:+821012345678">010-1234-5678</a>
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span>서울특별시 강남구</span>
      </li>
    </ul>

    <nav class="social" aria-label="SNS 링크">
      <a href="https://github.com/" target="_blank" rel="noopener" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5z"/></svg>
      </a>
      <a href="https://www.linkedin.com/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.4 20.5h-3.6v-5.6c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9v5.7H9.3V9h3.4v1.6c.5-.9 1.7-1.8 3.4-1.8 3.6 0 4.3 2.4 4.3 5.5v6.2zM5.3 7.4a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2zM7.1 20.5H3.5V9h3.6v11.5zM22.2 0H1.8C.8 0 0 .8 0 1.7v20.6c0 .9.8 1.7 1.8 1.7h20.4c1 0 1.8-.8 1.8-1.7V1.7C24 .8 23.2 0 22.2 0z"/></svg>
      </a>
      <a href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"/></svg>
      </a>
      <a href="https://x.com/" target="_blank" rel="noopener" aria-label="X (Twitter)">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.2 2.3h3.4l-7.4 8.4 8.7 11.5h-6.8l-5.3-7-6.1 7H1.3l7.9-9L.9 2.3h7l4.8 6.3 5.5-6.3zm-1.2 17.9h1.9L7 4.2H5l12 16z"/></svg>
      </a>
    </nav>
  </main>

</body>
</html>
